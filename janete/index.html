<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Janete · Vinci</title><style>body{margin:0;background:#0b1115;color:#eef4f1;font:16px system-ui;padding:24px}main{max-width:760px;margin:auto}h1{letter-spacing:.08em}.card{background:#111b20;border:1px solid #2a3a42;border-radius:16px;padding:18px;margin-top:18px}input,textarea,button{font:inherit}input,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid #3b555e;background:#0b1115;color:#fff}button{cursor:pointer;border:0;border-radius:9px;padding:12px 16px;background:#1fd1a5;color:#04110d;font-weight:700;margin-top:10px}.hidden{display:none!important}.err{color:#ff928e;min-height:24px}.messages{min-height:280px;max-height:55vh;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:16px 0}.msg{padding:10px 12px;border-radius:10px;white-space:pre-wrap}.a{background:#17392f;align-self:flex-start}.u{background:#27313a;align-self:flex-end}form{display:flex;gap:8px;align-items:end}form textarea{flex:1}.muted{color:#8ea3aa;font-size:13px}</style><main><section id="gate" class="card"><h1>JANETE</h1><p class="muted">VINCI · ESPELHO LOCAL DO SKYNET</p><input id="pw" type="password" placeholder="Senha"><button id="enter">Entrar</button><div id="err" class="err"></div></section><section id="app" class="hidden"><h1>JANETE</h1><p class="muted">VINCI · SKYNET CHAT · <span id="status">offline</span></p><div class="card"><div id="msgs" class="messages"></div><form id="form"><textarea id="draft" rows="2" placeholder="Fale com a Janete…"></textarea><button>Enviar</button></form></div></section></main><script>const API='https://complex-signature-accessed-loan.trycloudflare.com';let t=sessionStorage.getItem('jtoken')||'',timer;const $=x=>document.getElementById(x);async function q(p,o={}){let h={Accept:'application/json','X-Janete-Extension':'vinciautomacao'};if(o.body)h['Content-Type']='application/json';if(t)h.Authorization='Bearer '+t;let r=await fetch(API+p,{...o,headers:h,cache:'no-store'});if(!r.ok)throw Error(r.status===401?'Senha incorreta.':'Ponte offline.');return r.json()}function draw(a){let b=$('msgs');b.replaceChildren();(a||[]).forEach(m=>{let d=document.createElement('div');d.className='msg '+((m.speaker==='assistant'||m.speaker==='janete')?'a':'u');d.textContent=m.text||'';b.append(d)});b.scrollTop=b.scrollHeight}async function sync(){try{let d=await q('/api/messages');draw(d.messages);$('status').textContent='online'}catch(e){$('status').textContent='offline'}}async function login(){try{let d=await q('/api/login',{method:'POST',body:JSON.stringify({password:$('pw').value})});t=d.token;sessionStorage.setItem('jtoken',t);$('gate').classList.add('hidden');$('app').classList.remove('hidden');await sync();timer=setInterval(sync,3000)}catch(e){$('err').textContent=e.message}}$('enter').onclick=login;$('pw').onkeydown=e=>e.key==='Enter'&&login();$('form').onsubmit=async e=>{e.preventDefault();let v=$('draft').value.trim();if(!v)return;await q('/api/send',{method:'POST',body:JSON.stringify({text:v})});$('draft').value='';sync()};if(t){$('gate').classList.add('hidden');$('app').classList.remove('hidden');sync();timer=setInterval(sync,3000)}</script></html>
